<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Caixa do Mercado{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Caixa Eletrônico do Mercado</h1>
        <nav>
            <ul>
                <li><a href="{{ url_for('pagina_inicial') }}">Início</a></li>
                <li><a href="{{ url_for('cadastrar_produto') }}">Cadastrar Produto</a></li>
                <li><a href="{{ url_for('criar_compra') }}">Criar Compra</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
